<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas del curso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="contenido-principal" class="contenedor">
    <header class="encabezado">
      <h1>Notas del curso</h1>
      <p>Registra hasta 10 alumnos con sus tres certámenes. Se aprueba con promedio de 55 o más.</p>
    </header>

    <section class="tarjeta" aria-labelledby="titulo-form" id="formulario-seccion">
      <h2 id="titulo-form">Nuevo alumno</h2>

      <form id="formulario" novalidate>
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="off" maxlength="40">
        </div>

        <div class="fila-notas">
          <div class="campo">
            <label for="c1">Certamen 1</label>
            <input type="number" id="c1" inputmode="decimal" min="0" max="100" step="any" placeholder="0 a 100">
          </div>
          <div class="campo">
            <label for="c2">Certamen 2</label>
            <input type="number" id="c2" inputmode="decimal" min="0" max="100" step="any" placeholder="0 a 100">
          </div>
          <div class="campo">
            <label for="c3">Certamen 3</label>
            <input type="number" id="c3" inputmode="decimal" min="0" max="100" step="any" placeholder="0 a 100">
          </div>
        </div>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

        <div class="acciones">
          <button type="submit" id="btn-agregar" class="btn btn-principal">Agregar alumno</button>
          <button type="button" id="btn-reiniciar" class="btn btn-secundario">Reiniciar curso</button>
        </div>
        <p id="contador" class="contador"></p>
      </form>
    </section>
  </main>
</body>
</html>
